                border: 1px solid black;

                height: 200px;
                margin: auto;
            }
        </style>
    </head>
    <body>
        <h2>make changes to the rectangle</h2>
         <div class="rectangle"></div>

         <div class="buttons">
            <button on click="change to circle()">make circle</button>
            <button on click="hiderect()">hide</button>
            <button on click="showRect()">show</button>
         </div>

         <script>
            let div = document.queryselector(" .rectangle");

            function changeToCircle() {
                div.style.borrderRadius = "50%"
            }
             function hideRect() {
                div.style.display = "none"
            }
            function showRect() {
                div.style.display = "block"
                }
                div.onmouseenter = funtion () {
                    div.style.background = "red";
                };
                div.onmouseleave = funtion () {
                    div.style.background = "transparent";
                };

         </script>
